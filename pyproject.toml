[project]
name = "agentscope"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "frontend", ".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
